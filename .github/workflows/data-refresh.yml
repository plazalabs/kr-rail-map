name: data-refresh

# 매달 시세 자동 갱신 (2026-11-15, 메타 피드백 ②: '시세가 9월에서 멈춰 있다').
# 국토교통부 실거래가를 새로 받아 시세·단지·실거래 7종·전세가율·가격 흐름을 다시 만들고,
# 문지기(data/check_refresh.py)를 통과할 때만 main 에 커밋한다 → GitHub Pages 가 다시 배포.
#
# 언제: 매달 2일 06:00 KST. M월 거래 신고는 M+1월 말 마감이라 그때 '두 달 전' 달이 새로 다 모인다.
# 키: 저장소 Settings → Secrets → Actions → DATA_GO_KR_KEY (data.go.kr 일반 인증키 Decoding)
# 캐시는 두지 않는다 — 한 달에 한 번이라 Actions 캐시(7일 미사용 시 삭제)가 남지 않는다. 매번 전부 받는다(약 1시간).
on:
  schedule:
    - cron: '0 21 1 * *'      # UTC 1일 21:00 = KST 2일 06:00
  workflow_dispatch:
    inputs:
      last:
        description: '마지막 달 YYYYMM (비우면 두 달 전 자동)'
        required: false

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      RTMS_LAST: ${{ github.event.inputs.last }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 키 확인
        run: |
          if [ -z "$DATA_GO_KR_KEY" ]; then echo "::error::DATA_GO_KR_KEY 비밀값이 없다"; exit 1; fi

      - name: 기간
        id: p
        run: |
          read A B FIRST < <(python data/rtms_period.py)
          echo "a=$A" >> "$GITHUB_OUTPUT"; echo "b=$B" >> "$GITHUB_OUTPUT"; echo "first=$FIRST" >> "$GITHUB_OUTPUT"
          echo "시세 기간 $A~$B · 가격 흐름 $FIRST~$B"

      - name: 받기 — 아파트 매매 (가격 흐름용 2023~)
        run: python data/fetch_rtms.py --metro --from ${{ steps.p.outputs.first }} --to ${{ steps.p.outputs.b }} | tail -3

      - name: 받기 — 아파트 매매 기간 합본 (시세·단지용)
        run: python data/fetch_rtms.py --metro --from ${{ steps.p.outputs.a }} --to ${{ steps.p.outputs.b }} | tail -2

      - name: 받기 — 실거래 7종 (전월세·분양권·오피스텔·연립·토지·상업)
        run: python data/fetch_rtms.py --metro --kind new7 --from ${{ steps.p.outputs.a }} --to ${{ steps.p.outputs.b }} | grep -E '===|거래|⚠' || true

      - name: 문지기 1 — 빠진 달 없음
        run: python data/check_refresh.py fetched

      - name: 만들기
        run: |
          set -e
          python data/build_station_price.py
          python data/build_station_complex.py
          python data/build_station_market.py
          python data/build_station_jeonse.py
          python data/build_station_trend.py

      - name: 문지기 2 — 직전보다 10% 넘게 줄지 않음
        run: python data/check_refresh.py built

      - name: 서비스워커 자료 달 (다시 찾은 사람도 새 시세를 받게)
        run: sed -i "s/^const DATA_REV = '[0-9]\{6\}';/const DATA_REV = '${{ steps.p.outputs.b }}';/" sw.js

      - name: 단위 시험
        run: |
          fail=0
          for f in tests/*.test.js; do node "$f" > /tmp/t.log 2>&1 || { echo "✗ $f"; tail -20 /tmp/t.log; fail=1; }; done
          exit $fail

      - name: 커밋
        run: |
          git config user.name "kr-rail-map data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/station-price.json data/station-complex.json data/station-market.json data/station-jeonse.json data/station-trend.json sw.js
          if git diff --cached --quiet; then echo "바뀐 자료 없음"; exit 0; fi
          git commit -m "data: 실거래 시세 자동 갱신 ${{ steps.p.outputs.a }}~${{ steps.p.outputs.b }}"
          git push
