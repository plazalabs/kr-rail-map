name: test

# 빌드 스텝이 없는 정적 사이트라서, 테스트만 돌린다.
# 데이터(geojson)를 손으로 고치는 일이 잦은데 지금까지는 로컬에서만
# 돌려서, 깨진 채로 푸시해도 아무도 몰랐다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 각 테스트는 의존성 없는 단일 스크립트다 (실패 시 exit 1).
      # 하나라도 실패하면 워크플로가 빨간불이 되도록 set -e 로 돌린다.
      - name: 단위 테스트
        run: |
          set -e
          fail=0
          for f in tests/*.test.js; do
            echo "── $f"
            node "$f" || fail=1
          done
          exit $fail

      # 파이프라인 스크립트의 자체 점검. 키 없이 돌아간다 — 표·이름 해석·
      # 법정동 매칭·XML 파서를 실제 사례로 검증한다. 이걸 안 돌리면 코드표가
      # 조용히 틀어져도 아무도 모른다 (실제로 인천 코드를 세 번 틀렸다).
      - name: 파이프라인 자체 점검
        run: |
          set -e
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          $PY data/lawd.py
          $PY data/dong_match.py
          $PY data/station_names.py
          $PY data/official_stations.py --selftest
          $PY data/fetch_rtms.py --selftest
          $PY data/fetch_kapt.py --selftest
          $PY data/bjd_codes.py --selftest
          $PY data/fetch_dev.py --selftest
          $PY data/build_station_dev.py --selftest

      # 라이선스 표는 손으로 고치지 않는다. data/sources.json 이 원본이고
      # data.html 의 표는 거기서 만든다. 둘이 어긋나면 잘못된 이용 조건이
      # 배포되므로 여기서 막는다.
      - name: 출처 표가 sources.json 과 같은지
        run: |
          set -e
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          $PY data/build_sources.py --check

      # 데이터가 서로 어긋나지 않는지 — 역 id 참조, 좌표 범위, JSON 유효성.
      # 테스트가 이미 대부분 덮지만, 여기서는 파일 자체가 열리는지만 본다.
      - name: 데이터 파일 무결성
        run: |
          set -e
          # 파일마다 본체가 들어 있는 키를 명시한다. features/stations 만 세던
          # 시절엔 line-membership.json(본체가 lines)이 0건으로 세여 ce37a74 부터
          # 빨간불이었다. 키를 추측하지 않고 지정해야 키가 바뀌거나 빠져도 잡힌다.
          node -e '
            const fs = require("fs");
            const files = {   // 파일: [본체 키, 형태]
              "data/lines.geojson": ["features", "array"], "data/stations.geojson": ["features", "array"],
              "data/exits.geojson": ["features", "array"], "data/station-price.json": ["stations", "object"],
              "data/transfer-times.json": ["stations", "object"], "data/line-membership.json": ["lines", "object"]
            };
            for (const [f, [key, kind]] of Object.entries(files)) {
              const d = JSON.parse(fs.readFileSync(f, "utf8"));
              const v = d[key];
              const ok = kind === "array" ? Array.isArray(v) : (v !== null && typeof v === "object" && !Array.isArray(v));
              if (!ok) throw new Error(f + ": ." + key + " is missing or not " + kind);
              const n = kind === "array" ? v.length : Object.keys(v).length;
              console.log(f + " ." + key + " OK (" + n + ")");
              if (!n) throw new Error(f + ": ." + key + " is empty");
            }
          '
