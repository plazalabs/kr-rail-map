name: test

# 빌드 스텝이 없는 정적 사이트라서, 테스트만 돌린다.
# 데이터(geojson)를 손으로 고치는 일이 잦은데 지금까지는 로컬에서만
# 돌려서, 깨진 채로 푸시해도 아무도 몰랐다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 각 테스트는 의존성 없는 단일 스크립트다 (실패 시 exit 1).
      # 하나라도 실패하면 워크플로가 빨간불이 되도록 set -e 로 돌린다.
      - name: 단위 테스트
        run: |
          set -e
          fail=0
          for f in tests/*.test.js; do
            echo "── $f"
            node "$f" || fail=1
          done
          exit $fail

      # 데이터가 서로 어긋나지 않는지 — 역 id 참조, 좌표 범위, JSON 유효성.
      # 테스트가 이미 대부분 덮지만, 여기서는 파일 자체가 열리는지만 본다.
      - name: 데이터 파일 무결성
        run: |
          set -e
          node -e '
            const fs = require("fs");
            const files = ["data/lines.geojson","data/stations.geojson",
                           "data/exits.geojson","data/station-price.json"];
            for (const f of files) {
              const d = JSON.parse(fs.readFileSync(f, "utf8"));
              const n = d.features ? d.features.length : Object.keys(d.stations || {}).length;
              console.log(f + " OK (" + n + ")");
              if (!n) throw new Error(f + " is empty");
            }
          '
