<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판 | 한국철도맵</title>
<meta name="description" content="한국철도맵 게시판 — 우리 역 이야기, GTX 개통 이야기, 개발자에게 의견.">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="canonical" href="https://plazalabs.github.io/kr-rail-map/board.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="한국철도맵">
<meta property="og:title" content="게시판 | 한국철도맵">
<meta property="og:image" content="https://plazalabs.github.io/kr-rail-map/image/og-rank.jpg">
<meta name="theme-color" content="#0b57d0">
<link rel="stylesheet" href="vendor/pretendard/pretendard.css">
<style>
:root{--bg:#fff;--surface:#f6f7f9;--card:#fff;--text:#16191d;--text2:#4a5158;--muted:#666e76;--border:#e3e6ea;--accent:#0b57d0;--accentbg:#e8f0fe;--warn:#8a5300;--warnbg:#fff8e6;--ok:#1f7a4a}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--surface:#1c2024;--card:#191d21;--text:#e8eaed;--text2:#b3bac1;--muted:#9aa2aa;--border:#2c3238;--accent:#8ab0ff;--accentbg:#1b2840;--warn:#e0b060;--warnbg:#2a2416;--ok:#7fd3a3}}
*{box-sizing:border-box}
body{margin:0;font-family: "Pretendard Variable", "Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit} button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{border-bottom:1px solid var(--border);background:var(--surface)}
header.top .wrap{padding:13px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:16px;text-decoration:none;letter-spacing:-.02em;white-space:nowrap}
.logo i{display:inline-block;width:4px;height:15px;border-radius:2px;margin-right:7px;vertical-align:-2px;background:linear-gradient(180deg,#0052a4 0 33%,#00a84d 33% 66%,#ef7c1c 66% 100%)}
header.top nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
header.top nav a{text-decoration:none;color:var(--text2);white-space:nowrap}
header.top nav a[aria-current]{color:var(--accent);font-weight:700}
h1{font-size:26px;letter-spacing:-.03em;margin:24px 0 4px}
.lede{color:var(--text2);font-size:14px;margin:0 0 16px}
.side{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1px solid var(--border);background:var(--card);text-decoration:none;font-size:13.5px;font-weight:700}
.pill.coffee{background:#ffe8b8;border-color:#f3cf7d;color:#5a3d00}
.notice{background:var(--warnbg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--warn);font-size:14px}
form{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:grid;gap:10px}
.row2{display:flex;flex-wrap:wrap;gap:8px}
.row2>*{flex:1;min-width:140px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],select,textarea{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--card);font-size:14px;width:100%}
textarea{min-height:96px;resize:vertical}
.cnt{font-size:12px;color:var(--muted);text-align:right}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.send{justify-self:end;padding:9px 18px;border-radius:9px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.send:disabled{opacity:.6;cursor:default}
.msg{font-size:13px;min-height:1.2em}
.msg.err{color:#b42318}.msg.ok{color:var(--ok)}
@media(prefers-color-scheme:dark){.msg.err{color:#f19a92}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:20px 0 8px}
.tabs button{border:1px solid var(--border);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.posts{list-style:none;margin:0;padding:0}
.post{border-bottom:1px solid var(--border);padding:12px 2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.meta .nick{font-weight:700;color:var(--text)}
.kind{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--accentbg);color:var(--accent)}
.st{font-size:12px;font-weight:700;color:var(--text2)}
.body{white-space:pre-wrap;word-break:break-word;font-size:14.5px;margin:6px 0 4px}
.rep{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;margin-left:auto}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.more{display:block;width:100%;margin:14px 0 40px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer}
.rules{font-size:12px;color:var(--muted);margin:10px 0 0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="./"><i></i>한국철도맵</a>
<nav><a href="./">지도</a><a href="./?rocket=1">떡상 랭킹</a><a href="board.html" aria-current="page">게시판</a></nav></div></header>
<main class="wrap">
<h1>💬 게시판</h1>
<p class="lede">우리 역 이야기, GTX 개통 이야기, 개발자에게 하고 싶은 말을 남겨 주세요. 로그인 없이 쓸 수 있어요.</p>
<div class="side">
  <a class="pill" id="fb-link" href="#" target="_blank" rel="noopener">🛠️ 오류 제보·기능 제안</a>
  <a class="pill coffee" id="coffee-link" href="#" target="_blank" rel="noopener" hidden>☕ 개발자에게 커피 한잔</a>
</div>

<div class="notice" id="not-ready" hidden>게시판을 준비하고 있어요. 곧 열립니다. 그동안 의견은 위의 <b>오류 제보·기능 제안</b>으로 보내 주세요.</div>

<section id="board" hidden>
  <form id="f" novalidate>
    <div class="row2">
      <label class="f">종류<select id="kind"><option value="free">자유</option><option value="station">우리 역 이야기</option><option value="dev">개발자에게 의견</option></select></label>
      <label class="f">닉네임 (선택)<input type="text" id="nick" maxlength="20" placeholder="익명" autocomplete="nickname"></label>
      <label class="f">역 이름 (선택)<input type="text" id="station" maxlength="30" placeholder="예: 광운대"></label>
    </div>
    <label class="f">내용<textarea id="body" maxlength="1000" placeholder="2~1,000자. 다른 사람을 비방하거나 광고하는 글은 신고로 숨겨집니다." required></textarea></label>
    <div class="hp" aria-hidden="true"><label>홈페이지<input type="text" id="hp" tabindex="-1" autocomplete="off"></label></div>
    <div class="cnt" id="cnt">0 / 1,000</div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <button class="send" id="send" type="submit">올리기</button>
  </form>
  <p class="rules">개인 정보(전화번호·주소)는 쓰지 마세요. 글은 고치거나 지울 수 없어요. 신고가 3번 쌓이면 자동으로 숨겨집니다.</p>

  <div class="tabs" role="group" aria-label="종류로 거르기">
    <button data-k="" aria-pressed="true">전체</button><button data-k="free" aria-pressed="false">자유</button>
    <button data-k="station" aria-pressed="false">우리 역 이야기</button><button data-k="dev" aria-pressed="false">개발자에게 의견</button>
  </div>
  <ol class="posts" id="posts" aria-live="polite"></ol>
  <button class="more" id="more" hidden>더 보기</button>
</section>
</main>

<script src="js/board-config.js"></script>
<script src="js/board.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const C = KrBoard.cfg();
  if (/^https:\/\//.test(C.feedbackUrl || '')) $('fb-link').href = C.feedbackUrl; else $('fb-link').hidden = true;
  if (/^https:\/\//.test(C.coffeeUrl || '')) { $('coffee-link').href = C.coffeeUrl; $('coffee-link').hidden = false; }
  if (!KrBoard.ready()) { $('not-ready').hidden = false; return; }
  $('board').hidden = false;

  const qs = new URLSearchParams(location.search);
  let kind = KrBoard.KINDS[qs.get('kind')] ? qs.get('kind') : '';
  if (qs.get('station')) { $('station').value = qs.get('station').slice(0, 30); $('kind').value = 'station'; }
  let last = null;

  // 글 한 개 — 사용자 글은 textContent 로만 넣는다
  function item(p) {
    const li = document.createElement('li'); li.className = 'post';
    const meta = document.createElement('div'); meta.className = 'meta';
    const k = document.createElement('span'); k.className = 'kind'; k.textContent = KrBoard.KINDS[p.kind] || '자유';
    const n = document.createElement('span'); n.className = 'nick'; n.textContent = p.nick || '익명';
    meta.append(k, n);
    if (p.station) {
      // 역 이야기(역 상세에서 쓴 글)는 '역이름·역ID' — 이름만 보여 주고 누르면 지도에서 그 역
      const ps = KrBoard.parseStation(p.station);
      const s = document.createElement(ps.id ? 'a' : 'span'); s.className = 'st'; s.textContent = '🚉 ' + ps.name;
      if (ps.id) s.href = './?st=' + encodeURIComponent(ps.id);
      meta.append(s);
    }
    const t = document.createElement('time'); t.dateTime = p.created_at; t.textContent = KrBoard.ago(p.created_at); t.title = new Date(p.created_at).toLocaleString('ko-KR'); meta.append(t);
    const r = document.createElement('button'); r.className = 'rep'; r.type = 'button'; r.textContent = '신고'; r.dataset.id = p.id; meta.append(r);
    const b = document.createElement('div'); b.className = 'body'; b.textContent = p.body;
    li.append(meta, b);
    return li;
  }
  async function load(more) {
    if (!more) { $('posts').innerHTML = ''; last = null; }
    try {
      const rows = await KrBoard.list({ kind, before: more ? last : null, limit: 30 });
      if (!more && !rows.length) { const e = document.createElement('li'); e.className = 'empty'; e.textContent = '아직 글이 없어요. 첫 글을 남겨 주세요!'; $('posts').append(e); }
      rows.forEach(p => $('posts').append(item(p)));
      if (rows.length) last = rows[rows.length - 1].created_at;
      $('more').hidden = rows.length < 30;
    } catch (e) {
      const li = document.createElement('li'); li.className = 'empty'; li.textContent = e.message; $('posts').append(li);
    }
  }
  function syncTabs() { document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === kind))); }

  $('body').addEventListener('input', () => { $('cnt').textContent = $('body').value.length.toLocaleString() + ' / 1,000'; });
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    $('send').disabled = true; $('msg').className = 'msg'; $('msg').textContent = '올리는 중…';
    const res = await KrBoard.post({ kind: $('kind').value, nick: $('nick').value, station: $('station').value, body: $('body').value, honeypot: $('hp').value })
      .catch(() => ({ ok: false, why: '올리지 못했어요. 인터넷 연결을 확인해 주세요.' }));
    $('send').disabled = false;
    if (!res.ok) { $('msg').className = 'msg err'; $('msg').textContent = res.why; return; }
    $('msg').className = 'msg ok'; $('msg').textContent = '올렸어요. 고마워요!';
    $('body').value = ''; $('cnt').textContent = '0 / 1,000';
    kind = ''; syncTabs(); load(false);
  });
  document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; kind = b.dataset.k; syncTabs(); load(false); });
  $('more').addEventListener('click', () => load(true));
  $('posts').addEventListener('click', async e => {
    const b = e.target.closest('.rep'); if (!b) return;
    if (!confirm('이 글을 신고할까요? 신고가 3번 쌓이면 숨겨집니다.')) return;
    const r = await KrBoard.report(b.dataset.id).catch(() => ({ ok: false }));
    b.textContent = r.ok ? (r.already ? '이미 신고함' : '신고됨') : '신고 실패';
    b.disabled = true;
  });
  syncTabs(); load(false);
})();
</script>
</body>
</html>
