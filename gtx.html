<style>
:root{--bg:#fff;--surface:#f6f7f9;--card:#fff;--text:#16191d;--text2:#4a5158;--muted:#5b6470;--border:#e3e6ea;
--accent:#1b64da;--accentbg:#e8f0fe;--acc:#08743c;--accbg:#dcf5e6;--mk:#6a2fc0;--mkbg:#f1eafd;
--r-card:18px;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--surface:#1c2024;--card:#191d21;--text:#e8eaed;--text2:#b3bac1;--muted:#9aa2aa;
--border:#2c3238;--accent:#8ab0ff;--accentbg:#1b2840;--acc:#4fd88a;--accbg:#12301f;--mk:#c4a3ff;--mkbg:#2a1f3d;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.32)}}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard Variable","Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--accent)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
header.top{background:var(--surface);box-shadow:var(--shadow)}
header.top .wrap{padding:13px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:17px;text-decoration:none;color:var(--text);white-space:nowrap}
header.top nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
header.top nav a{text-decoration:none;color:var(--text2);white-space:nowrap}
h1{font-size:24px;line-height:1.3;letter-spacing:-.035em;margin:26px 0 12px}
.lede{color:var(--text2);font-size:14px;margin:0 0 14px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--accent);border-radius:14px;background:var(--card);color:var(--text);min-height:52px}
.pick{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.pick button{width:100%;text-align:left;min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);cursor:pointer}
.msg{color:var(--text2);font-size:14px;margin:10px 0}
.top3{margin:22px 0 0}
.top3 h2{font-size:14px;margin:0 0 2px}
.top3 p{font-size:12px;color:var(--muted);margin:0 0 8px}
.top3 ol{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.top3 button{min-height:44px;padding:8px 12px;border:1px solid var(--border);border-radius:999px;background:var(--surface);cursor:pointer;font-size:14px}
.card{margin:20px 0 0;padding:22px 20px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow);border:1px solid var(--border)}
.card .st{font-size:15px;font-weight:700;margin:0 0 6px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.25;margin:4px 0 14px}
.big small{display:block;font-size:14px;font-weight:600;color:var(--text2);letter-spacing:0}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;font-size:15px;font-weight:700;cursor:pointer;background:none}
.chip span{font-size:12px;font-weight:600;color:var(--muted)}
.chip.acc{border-radius:999px;background:var(--accbg);color:var(--acc);border:2px solid var(--acc)}
.chip.mk{border-radius:6px;background:var(--mkbg);color:var(--mk);border:2px solid var(--mk)}
.chip.mk.hold{border-style:dashed;background:none}
.chip.mk.none{border:0;background:var(--surface);color:var(--muted)}
.chip-note{font-size:13px;color:var(--text2);margin:-6px 0 12px}
.small{font-size:12.5px;color:var(--muted);margin:2px 0}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:#fff6da;color:#7a5600;margin-left:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.actions button,.actions a{min-height:44px;display:inline-flex;align-items:center;padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);text-decoration:none;color:var(--text);font-size:14px;cursor:pointer}
.actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
details{margin:14px 0 0;border-top:1px solid var(--border);padding-top:10px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;font-size:14px}
details table{width:100%;border-collapse:collapse;font-size:13.5px}
details td,details th{padding:6px 4px;border-bottom:1px solid var(--border);text-align:left;font-variant-numeric:tabular-nums}
footer{font-size:12px;color:var(--muted);margin:30px 0 0}
</style>

<p class="lede">교통 접근성과 시세 흐름을 따로 보여 줍니다. 둘은 서로 다른 지표이며 집값·투자수익 예측이 아닙니다.</p>
<div class="search" role="search">
  <label for="q" class="small">역 이름이나 동 이름</label>
  <input id="q" type="search" autocomplete="off" placeholder="역 이름이나 동 이름 (예: 의정부, 운정)" aria-describedby="msg">
