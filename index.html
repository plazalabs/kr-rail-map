<body data-theme="light">
<a class="skip-link" href="#map">지도로 바로 가기</a>

<div id="app">
  <aside id="sidebar" aria-label="노선 및 검색 패널">
    <div class="sb-head">
      <h1 class="brand">한국철도맵</h1>
      <button id="sidebar-close" class="icon-btn mob-only" aria-label="패널 닫기">✕</button>
    </div>
    <p class="sb-sub">전국 철도 노선도 · <span id="data-summary">불러오는 중…</span></p>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="역 이름 검색" autocomplete="off"
             aria-label="역 검색" role="combobox" aria-expanded="false" aria-controls="search-results">
      <kbd class="search-kbd">/</kbd>
      <div id="search-results" role="listbox" aria-label="검색 결과"></div>
    </div>

    <div class="scope-row" role="group" aria-label="표시 범위">
      <button class="scope-btn active" data-scope="metro">수도권</button>
      <button class="scope-btn" data-scope="all">전국</button>
      <span class="scope-count" id="scope-count"></span>
    </div>

    <div class="panel-head">지도 테마</div>
    <div class="theme-row" id="theme-row"></div>

    <div class="panel-head">노선 <span id="line-count" class="count"></span>
      <button id="export-geojson" class="mini-btn" title="내가 그린 노선 GeoJSON 다운로드">GeoJSON</button>
    </div>
    <div id="line-list"><p class="empty">데이터 로딩 중…</p></div>

    <div class="panel-head">나의 노선 <span id="myline-count" class="count"></span></div>
    <div id="myline-list"><p class="empty">그리기 모드에서 노선을 만들어보세요</p></div>
    <div id="memo-list"></div>
    <div id="fav-list"></div>

    <footer class="attrib">
      노선·역 데이터 © OpenStreetMap contributors (ODbL)<br>
      지도 © OpenStreetMap · OpenFreeMap / 위성 © Esri
    </footer>
  </aside>

  <div id="sidebar-backdrop" hidden></div>

  <main id="map-wrap">
    <div id="map" role="application" aria-label="철도 노선 지도"></div>

    <button id="sidebar-toggle" class="icon-btn floating" title="패널 열기" aria-label="패널 열기">
      <span class="burger" aria-hidden="true"></span>
    </button>

    <div id="toolbar" role="toolbar" aria-label="지도 도구">
      <div class="tb-group" role="group" aria-label="배경 지도">
        <button data-style="normal" class="active" title="일반 지도">일반</button>
        <button data-style="satellite" title="위성 지도">위성</button>
        <button data-style="gray" title="흑백 지도">흑백</button>
      </div>
      <button id="route-btn" class="tb-primary">길찾기</button>
      <button id="diagram-btn" title="45도 개략 노선도">노선도</button>
      <button id="locate-btn" class="tb-icon" title="내 위치" aria-label="내 위치로 이동">◎</button>
      <div class="tb-dropdown">
        <button class="tb-dropbtn" aria-haspopup="true" aria-expanded="false">도구</button>
        <div class="tb-dropmenu" role="menu">
          <button id="draw-btn" role="menuitem">나만의 노선 그리기</button>
          <button id="measure-btn" role="menuitem">거리·면적 측정</button>
          <button id="radius-btn" role="menuitem">반경 측정</button>
          <button id="memo-btn" role="menuitem">메모 핀</button>
        </div>
      </div>
      <div class="tb-dropdown">
        <button class="tb-dropbtn" aria-haspopup="true" aria-expanded="false">분석</button>
        <div class="tb-dropmenu" role="menu">
          <button id="compare-btn" role="menuitem">노선 비교</button>
          <button id="stats-btn" role="menuitem">철도망 통계</button>
          <button id="timeline-btn" role="menuitem">개통 타임라인</button>
          <button id="invest-btn" role="menuitem">역세권 투자분석</button>
          <button id="coverage-btn" role="menuitem">노선 영향권</button>
        </div>
      </div>
      <div class="tb-dropdown">
        <button class="tb-dropbtn" aria-haspopup="true" aria-expanded="false">저장</button>
        <div class="tb-dropmenu" role="menu">
          <button id="diagram-save-btn" role="menuitem">노선도 PNG</button>
          <button id="save-btn" role="menuitem">지도 PNG</button>
          <button id="share-btn" role="menuitem">링크 복사</button>
          <button id="report-btn" role="menuitem">오류 제보</button>
        </div>
      </div>
    </div>

    <div id="draw-panel" hidden>
      <div class="rp-head">나만의 노선 그리기 <button class="rp-close" data-close="draw-panel" aria-label="닫기">✕</button></div>
      <div class="dp-row"><label for="draw-name">이름</label><input id="draw-name" placeholder="나의 노선" autocomplete="off"></div>
      <div class="dp-row"><span>색상</span><div id="draw-palette"></div></div>
      <div class="dp-row"><label for="draw-dash">선 모양</label><select id="draw-dash"></select></div>
      <p class="rp-note">지도 클릭: 점 추가 · Enter: 완료 · Backspace: 되돌리기 · Esc: 취소</p>
    </div>

    <div id="route-panel" hidden>
      <div class="rp-head">길찾기 <button id="route-close" class="rp-close" aria-label="닫기">✕</button></div>
      <div class="ac-wrap">
        <label class="ac-label" for="route-from">출발</label>
        <input id="route-from" placeholder="출발역" autocomplete="off">
        <div class="ac-list" hidden></div>
      </div>
      <div class="ac-wrap">
        <label class="ac-label" for="route-to">도착</label>
        <input id="route-to" placeholder="도착역" autocomplete="off">
        <div class="ac-list" hidden></div>
      </div>
      <div class="rp-row">
        <button id="route-swap" title="출발·도착 바꾸기" aria-label="출발·도착 바꾸기">⇅</button>
        <button id="route-go">경로 찾기</button>
        <button id="route-save" title="이 경로를 즐겨찾기에 저장" aria-label="경로 저장">☆</button>
      </div>
      <div id="route-result"></div>
      <p class="rp-note">노선별 평균 속도로 어림한 예상 소요시간입니다</p>
    </div>

    <div id="status" role="status" aria-live="polite">지도 로딩 중…</div>
  </main>
